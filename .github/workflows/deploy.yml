
name: Insurance Project CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate README file
        run: test -f README.md

      - name: Validate database folder
        run: test -d database

      - name: Validate SQL files
        run: |
          find database -type f -name "*.sql" | grep -q .

  deploy-dev:
    name: Deploy to DEV
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DEV project files
        uses: actions/checkout@v4

      - name: Verify DEV project files
        run: |
          test -f README.md
          test -d database

  deploy-qa:
    name: Deploy to QA
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA project files
        uses: actions/checkout@v4

      - name: Verify QA project files
        run: |
          test -f README.md
          test -d database

  deploy-uat:
    name: Deploy to UAT
    needs: deploy-qa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UAT project files
        uses: actions/checkout@v4

      - name: Verify UAT project files
        run: |
          test -f README.md
          test -d database
